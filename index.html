<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a16" media="(prefers-color-scheme: dark)">
<title>Meine Pflanzen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ea;
    --card: #fffdf8;
    --text: #1f2a22;
    --muted: #6b746c;
    --line: #e6e0d3;
    --accent: #2f6b4f;
    --accent-soft: #e3eee6;
    --warn: #b4572e;
    --warn-soft: #f8e6dc;
    --shadow: 0 1px 2px rgba(40, 50, 40, .06), 0 6px 20px rgba(40, 50, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a16;
      --card: #1e2520;
      --text: #e8ece6;
      --muted: #9aa59c;
      --line: #2e3830;
      --accent: #7fc39d;
      --accent-soft: #24372b;
      --warn: #f0a07a;
      --warn-soft: #3a2a22;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px 40px;
  }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  header { margin: 8px 0 20px; }
  header h1 { font-size: 30px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  .heute {
    background: var(--accent);
    color: #fff;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
  }
  @media (prefers-color-scheme: dark) { .heute { color: #10251a; } }
  .heute h2 { font-size: 22px; margin-bottom: 10px; }
  .heute .leer { margin: 0; opacity: .92; }
  .aufgabe {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: rgba(255, 255, 255, .14);
    border-radius: 16px;
    padding: 12px;
    margin-top: 8px;
  }
  .aufgabe .symbol { font-size: 26px; line-height: 1; }
  .aufgabe strong { display: block; }
  .aufgabe span { font-size: 14px; opacity: .92; }
  .aktionen { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .aktionen:empty { display: none; }
  .knopf {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    border: 0;
    border-radius: 999px;
    padding: 8px 13px;
    cursor: pointer;
    background: #fff;
    color: #1f4a35;
  }
  .knopf.leise { background: rgba(255, 255, 255, .22); color: inherit; }
  .knopf:disabled { opacity: .6; cursor: default; }
  .karte .knopf { background: var(--accent-soft); color: var(--accent); padding: 7px 14px; font-size: 14px; }
  .notiert { font-size: 14px; font-weight: 600; }
  .karte .aktionen { margin-top: 12px; }

  .abschnitt { font-size: 20px; margin: 0 4px 12px; }
  .karte {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .foto {
    aspect-ratio: 4 / 3;
    width: 100%;
    object-fit: cover;
    display: block;
    background: var(--accent-soft);
  }
  .foto-platzhalter {
    aspect-ratio: 16 / 7;
    display: grid;
    place-items: center;
    font-size: 64px;
    background: linear-gradient(135deg, var(--accent-soft), var(--bg));
  }
  .inhalt { padding: 16px 18px 18px; }
  .inhalt h3 { font-size: 22px; }
  .botanisch { color: var(--muted); font-style: italic; margin: 0 0 10px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip {
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .werte { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wert {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .wert small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .wert b { display: block; font-size: 16px; font-weight: 600; }
  .wert span { font-size: 13px; color: var(--muted); }
  .wert.faellig { background: var(--warn-soft); border-color: transparent; }
  .wert.faellig span { color: var(--warn); font-weight: 600; }
  .rhythmus { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: " ▾"; }
  details[open] summary::after { content: " ▴"; }
  details ul { margin: 8px 0 0; padding-left: 20px; }
  details li { margin-bottom: 6px; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
  .fehler { background: var(--warn-soft); color: var(--warn); padding: 14px; border-radius: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Meine Pflanzen</h1>
    <p id="datum"></p>
  </header>

  <section class="heute" id="heute">
    <h2>Heute zu tun</h2>
    <p class="leer">Lade …</p>
  </section>

  <h2 class="abschnitt">Alle Pflanzen</h2>
  <div id="pflanzen"></div>

  <footer>Erinnerung jeden Morgen um 8 Uhr per Push</footer>
</main>

<script>
  const ZONE = "Europe/Berlin";
  const heuteIso = new Intl.DateTimeFormat("en-CA", { timeZone: ZONE }).format(new Date());
  const SAISON_NAME = { sommer: "Sommer", uebergang: "Übergangszeit", winter: "Winter" };

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tageZwischen = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  const datumLang = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });

  function relativ(iso) {
    const t = tageZwischen(heuteIso, iso);
    if (t === 0) return "heute";
    if (t === 1) return "morgen";
    if (t === -1) return "gestern";
    return t > 0 ? `in ${t} Tagen` : `vor ${-t} Tagen`;
  }

  function saison(daten) {
    const monat = Number(heuteIso.slice(5, 7));
    return Object.keys(daten.jahreszeiten).find(n => daten.jahreszeiten[n].includes(monat)) || "sommer";
  }

  const istHeuteDran = p => !!p.offen || p.naechstesGiessen <= heuteIso;

  // Knopfdrücke gehen an ein ntfy-Topic. Der Agent trägt sie beim nächsten Lauf (alle 6 Stunden) ein.
  const ANTWORT_TOPIC = "https://ntfy.sh/pflanzen-fg4k54sgxx-antwort";
  const NOTIERT_TEXT = { gegossen: "✓ Gegossen notiert", feucht: "✓ Notiert, ich erinnere dich morgen" };
  const merkKey = id => `antwort:${id}:${heuteIso}`;
  function gemerkt(id) {
    try { return localStorage.getItem(merkKey(id)); } catch (e) { return null; }
  }
  function merke(id, aktion) {
    try { localStorage.setItem(merkKey(id), aktion); } catch (e) {}
  }

  function knoepfe(p, mitFeucht) {
    const schon = gemerkt(p.id);
    if (schon) return `<span class="notiert">${NOTIERT_TEXT[schon]}</span>`;
    return `<button class="knopf" data-aktion="gegossen" data-id="${esc(p.id)}">${mitFeucht ? "Gegossen ✓" : "Heute gegossen"}</button>` +
      (mitFeucht ? `<button class="knopf leise" data-aktion="feucht" data-id="${esc(p.id)}">Noch feucht</button>` : "");
  }

  document.addEventListener("click", async e => {
    const knopf = e.target.closest("[data-aktion]");
    if (!knopf) return;
    const { aktion, id } = knopf.dataset;
    const leiste = knopf.parentElement;
    leiste.querySelectorAll("button").forEach(b => b.disabled = true);
    try {
      const antwort = await fetch(ANTWORT_TOPIC, { method: "POST", body: `${aktion}:${id}` });
      if (!antwort.ok) throw new Error(antwort.status);
      merke(id, aktion);
      document.querySelectorAll(`.aktionen[data-fuer="${id}"]`).forEach(el =>
        el.innerHTML = `<span class="notiert">${NOTIERT_TEXT[aktion]}</span>`);
    } catch (err) {
      leiste.querySelectorAll("button").forEach(b => b.disabled = false);
      alert("Das hat nicht geklappt. Bitte nochmal tippen.");
    }
  });

  function zeigeHeute(daten) {
    const el = document.getElementById("heute");
    const dran = daten.pflanzen.filter(istHeuteDran);
    if (dran.length) {
      el.innerHTML = `<h2>Heute zu tun</h2>` + dran.map(p => `
        <div class="aufgabe">
          <div class="symbol">💧</div>
          <div>
            <strong>${esc(p.name)} gießen${p.offen && p.offen.erinnerungen > 1 ? " (2. Erinnerung)" : ""}</strong>
            <span>${esc(p.kurztipp)}</span>
            <div class="aktionen" data-fuer="${esc(p.id)}">${knoepfe(p, true)}</div>
          </div>
        </div>`).join("");
      return;
    }
    const als = [...daten.pflanzen].sort((a, b) => a.naechstesGiessen.localeCompare(b.naechstesGiessen))[0];
    el.innerHTML = `<h2>Heute zu tun</h2>
      <p class="leer">Heute nichts zu tun. 🌿<br>
      ${als ? `Als Nächstes: <b>${esc(als.name)}</b> am ${datumLang(als.naechstesGiessen)} (${relativ(als.naechstesGiessen)}).` : ""}</p>`;
  }

  function karte(p, s) {
    const foto = p.foto
      ? `<img class="foto" src="${esc(p.foto)}" alt="Foto: ${esc(p.name)}" loading="lazy"
           onerror="this.outerHTML='<div class=&quot;foto-platzhalter&quot;>${esc(p.emoji)}</div>'">`
      : `<div class="foto-platzhalter">${esc(p.emoji)}</div>`;
    const zuletzt = p.zuletztGegossen
      ? `<b>${datumLang(p.zuletztGegossen)}</b><span>${relativ(p.zuletztGegossen)}${p.zuletztGegossenQuelle === "angenommen" ? " · angenommen" : ""}</span>`
      : `<b>Unbekannt</b><span>noch nicht erfasst</span>`;
    const dran = istHeuteDran(p);
    return `
      <article class="karte" id="${esc(p.id)}">
        ${foto}
        <div class="inhalt">
          <h3>${esc(p.name)}</h3>
          <p class="botanisch">${esc(p.botanisch)}</p>
          <div class="chips">
            <span class="chip">📍 ${esc(p.standort)}</span>
            <span class="chip">🪴 ${esc(p.topf)}</span>
          </div>
          <div class="werte">
            <div class="wert"><small>Zuletzt gegossen</small>${zuletzt}</div>
            <div class="wert ${dran ? "faellig" : ""}"><small>Nächstes Gießen</small>
              <b>${datumLang(p.naechstesGiessen)}</b><span>${relativ(p.naechstesGiessen)}${p.grund === "noch feucht" ? " · nochmal prüfen" : ""}</span></div>
          </div>
          <div class="aktionen" data-fuer="${esc(p.id)}">${knoepfe(p, dran)}</div>
          <p class="rhythmus">${SAISON_NAME[s]}-Rhythmus: etwa alle ${p.intervallTage[s]} Tage, immer erst Fingerprobe.</p>
          <details>
            <summary>Pflegetipps</summary>
            <ul>${p.pflegetipps.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
          </details>
        </div>
      </article>`;
  }

  async function start() {
    document.getElementById("datum").textContent =
      new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", timeZone: ZONE });
    try {
      const antwort = await fetch("pflanzen.json?t=" + Date.now(), { cache: "no-store" });
      const daten = await antwort.json();
      const s = saison(daten);
      zeigeHeute(daten);
      document.getElementById("pflanzen").innerHTML = daten.pflanzen.map(p => karte(p, s)).join("");
      if (daten.aktualisiert) {
        const [tag, zeit] = daten.aktualisiert.split("T");
        document.getElementById("datum").textContent += ` · Stand ${tag === heuteIso ? "heute" : datumLang(tag)}, ${zeit} Uhr`;
      }
    } catch (e) {
      document.getElementById("heute").innerHTML =
        `<h2>Heute zu tun</h2><p class="fehler">Die Pflanzendaten konnten nicht geladen werden.</p>`;
    }
  }
  start();
</script>
</body>
</html>
